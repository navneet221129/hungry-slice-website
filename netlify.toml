[build]
  functions = "netlify/functions"
  publish = "."

# ==========================================================================
# MAINTENANCE MODE  —  TEMPORARY, added 2026-08-05
#
# Sends every public page to maintenance.html with HTTP 503 (Service
# Unavailable). 503 is deliberate: it tells Google the outage is temporary and
# to come back, whereas a 404/200 risks the pages being dropped from search.
#
# The admin console is deliberately excluded so the dashboard still works while
# the storefront is down. Rules are evaluated top-down, first match wins, so the
# exclusions must stay ABOVE the catch-all.
#
# TO BRING THE SITE BACK: delete this whole block and redeploy.
# ==========================================================================
[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin.js"
  to = "/admin.js"
  status = 200

[[redirects]]
  from = "/admin.css"
  to = "/admin.css"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/maintenance.html"
  to = "/maintenance.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 503
  force = true
# ===================== END MAINTENANCE MODE =====================

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://secure.tillpayments.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://assets3.lottiefiles.com https://gateway.tillpayments.com https://gateway.paynuts.com.au; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://wjhbkkthppbadcjnozal.supabase.co https://images.unsplash.com https://assets.mixkit.co https://d8j0ntlcm91z4.cloudfront.net; media-src 'self' blob: https://wjhbkkthppbadcjnozal.supabase.co https://assets.mixkit.co https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self' https://wjhbkkthppbadcjnozal.supabase.co wss://wjhbkkthppbadcjnozal.supabase.co https://gateway.tillpayments.com https://gateway.paynuts.com.au https://assets3.lottiefiles.com; frame-src 'self' https://gateway.tillpayments.com https://secure.tillpayments.com https://gateway.paynuts.com.au https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
